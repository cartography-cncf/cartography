name: Test Suite
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Explicitly grant the `secrets.GITHUB_TOKEN` no permissions.
permissions: {}

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Check lockfile is up-to-date
        run: uv lock --check
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          # mypy is the slowest hook by far, so it runs in its own job below, in parallel.
          SKIP: mypy
        with:
          extra_args: --all-files --show-diff-on-failure

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: mypy --all-files

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install the project
        # No extras on purpose: the only one is neo4j-rust, and unit tests mock the Neo4j
        # driver, so they never encode a Bolt frame. The codec is covered by the
        # integration matrix below, which talks to a real database.
        run: uv sync --frozen --dev
      - name: Run unit tests
        run: make test_unit

  # The integration suite is bound by Neo4j, not Python, so it is split across jobs, each
  # with its own Neo4j, rather than across processes on one runner. Whole test files move
  # between shards (see tests/sharding.py), balanced by tests/shard_durations.json.
  #
  # Both Bolt codecs are shipped: plain `cartography` gets the pure-Python one,
  # `cartography[neo4j-rust]` (what the published Docker image installs) gets the Rust
  # one, so the suite runs once per codec. The jobs run in parallel, so the second codec
  # costs no extra wall-clock.
  integration-shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        codec: [python, rust]
        # Keep in step with SHARD_TOTAL below and in the integration-tests job.
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      SHARD_TOTAL: 8
      # Neo4j is started in the background by the first step, so its image pull and boot
      # overlap checkout, install and collection; the test fixtures wait for it.
      NEO4J_URL: bolt://localhost:7687
    steps:
      - name: Start Neo4j in the background
        # Only the pull runs in the background; the container itself starts detached, so
        # no client stays attached to it. The log is printed below if a later step fails.
        run: |
          (
            docker pull neo4j:5-community &&
            docker run --detach --name neo4j --publish 7687:7687 \
              --env NEO4J_AUTH=none \
              --env NEO4J_server_memory_heap_initial__size=512m \
              --env NEO4J_server_memory_heap_max__size=2g \
              --env NEO4J_server_memory_pagecache_size=512m \
              neo4j:5-community
          ) > "$RUNNER_TEMP/neo4j-start.log" 2>&1 &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install the project
        env:
          EXTRAS: ${{ matrix.codec == 'rust' && '--extra neo4j-rust' || '' }}
        run: uv sync --frozen --dev $EXTRAS
      - name: Confirm the Rust Bolt codec is the one in use
        if: matrix.codec == 'rust'
        # Without this, an install that quietly failed to pick the extension up would
        # leave this job testing the pure-Python codec while reporting green. `_rust_pack`
        # is private, but it is the only thing that proves the driver actually loaded the
        # extension: the shared object can be installed and still fail to load.
        run: |
          uv run --frozen python - <<'PY'
          from neo4j._codec.packstream.v1 import _rust_pack

          if _rust_pack is None:
              raise SystemExit("Expected the Rust Bolt codec, got the pure-Python one")
          print("Rust Bolt codec in use.")
          PY
      - name: Run integration tests
        env:
          CARTOGRAPHY_TEST_SHARD: ${{ matrix.shard }}/${{ env.SHARD_TOTAL }}
          COVERAGE_FILE: .coverage.${{ matrix.codec }}-${{ matrix.shard }}
          CARTOGRAPHY_STORE_SHARD_DURATIONS: shard-durations-${{ matrix.codec }}-${{ matrix.shard }}.json
        # A single shard covers only part of the code, so the coverage threshold is
        # enforced on the combined data in the integration-tests job instead.
        run: make test_integration PYTEST_COV_FLAGS="--cov=cartography --cov-report= --cov-fail-under=0"
      - name: Show Neo4j startup output
        if: failure()
        run: |
          cat "$RUNNER_TEMP/neo4j-start.log" || true
          docker logs neo4j 2>&1 | tail -100 || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-${{ matrix.codec }}-${{ matrix.shard }}
          path: |
            .coverage.${{ matrix.codec }}-${{ matrix.shard }}
            shard-durations-${{ matrix.codec }}-${{ matrix.shard }}.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # One result per codec, under the job names branch protection already requires. A
  # shard uploads its artifact only as its last step, after its tests pass, so each job
  # gates on its own codec's artifacts: it fails unless all of that codec's shards
  # passed, and a failure in the other codec does not fail it. It then combines the
  # shards' coverage and enforces the coverage threshold from setup.cfg on the whole suite.
  integration-tests:
    # Run even when a shard fails, so the required check reports failure instead of
    # being skipped (a skipped required check counts as passing).
    if: ${{ !cancelled() }}
    needs: integration-shard
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        codec: [python, rust]
    name: ${{ matrix.codec == 'rust' && 'integration-tests-rust' || 'integration-tests' }}
    env:
      SHARD_TOTAL: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: integration-${{ matrix.codec }}-*
          merge-multiple: true
      - name: Combine coverage and enforce the threshold
        env:
          CODEC: ${{ matrix.codec }}
        run: |
          found=$(ls .coverage."$CODEC"-* 2>/dev/null | wc -l)
          if [ "$found" -ne "$SHARD_TOTAL" ]; then
            echo "Only $found of $SHARD_TOTAL $CODEC shards passed and uploaded their data"
            exit 1
          fi
          coverage_version=$(uv export --frozen --dev --no-hashes | sed -n 's/^coverage==\([^ ;]*\).*/\1/p')
          uvx --from "coverage==$coverage_version" coverage combine .coverage."$CODEC"-*
          uvx --from "coverage==$coverage_version" coverage report --skip-covered

  # Test that the docker image builds successfully on each commit
  build-docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: dev.Dockerfile
          push: false # only build the image, don't push it anywhere
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
